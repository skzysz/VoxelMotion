appId: app.blockfx.lite.desktop
productName: VoxelMotion
electronDist: node_modules/electron/dist
asar: true
npmRebuild: false
directories:
  output: dist
files:
  - main.js
  - preload.js
  - recovery-store.cjs
  - audio-export.cjs
  - update-service.cjs
  - voxelmotion-icon.png
  - www/**/*
  - package.json
  - THIRD_PARTY.md
extraResources:
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: ffmpeg/LICENSE.txt
  - from: node_modules/ffmpeg-static/ffmpeg.exe.README
    to: ffmpeg/BUILD-AND-SOURCE.txt
publish:
  provider: github
  owner: skzysz
  repo: VoxelMotion
win:
  icon: voxelmotion-icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: VoxelMotion-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  installerLanguages: [ru_RU, en_US]
portable:
  artifactName: VoxelMotion-${version}-Portable.${ext}
